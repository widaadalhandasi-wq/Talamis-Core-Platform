<div class="login-page-container">
  <div class="login-wrapper">
    
    <!-- الترويسة والشعار -->
    <div class="brand-header">
      <h1 class="brand-title">Talamis</h1>
      <p class="brand-subtitle">
        {{ mode() === 'login' ? 'Welcome back! Please enter your details.' : 'Create your account to get started' }}
      </p>
    </div>

    <!-- بطاقة النموذج بحجم مريح ومكبّر -->
    <form class="login-card" (ngSubmit)="submit()">
      
      @if (mode() === 'register') {
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input
            id="fullName"
            type="text"
            name="fullName"
            placeholder="John Doe"
            required
            [ngModel]="fullName()"
            (ngModelChange)="fullName.set($event)"
            class="form-input"
          />
        </div>
      }

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="name@example.com"
          required
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          placeholder="••••••••"
          required
          minlength="8"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          class="form-input"
        />
      </div>

      <!-- تنبيه الخطأ إن وجد -->
      @if (errorMessage()) {
        <div class="error-alert">
          {{ errorMessage() }}
        </div>
      }

      <!-- زر الدخول المكبّر -->
      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="btn-submit"
      >
        {{ isSubmitting() ? 'Please wait…' : mode() === 'login' ? 'Log in' : 'Sign up' }}
      </button>
    </form>

    <!-- زر التبديل السفلي -->
    <button
      type="button"
      (click)="toggleMode()"
      class="btn-toggle-mode"
    >
      {{
        mode() === 'login'
          ? "Don't have an account? Sign up"
          : 'Already have an account? Log in'
      }}
    </button>

  </div>
</div>
