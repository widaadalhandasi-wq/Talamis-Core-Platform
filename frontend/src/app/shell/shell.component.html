<div
  class="flex flex-col items-center justify-start"
  style="min-height: 100%; background: linear-gradient(90deg, rgb(248,249,250) 0%, rgb(248,249,250) 100%);"
>
  <!-- Mobile shell — constrains all screens to a phone-sized canvas -->
  <div
    class="relative flex flex-col"
    style="width: 390px; min-height: 100dvh; max-width: 100vw; overflow: hidden; background: rgb(248,249,250);"
  >
    <!-- Screen content — grows to fill, leaves room for bottom nav -->
    <div class="flex-1 overflow-y-auto" style="padding-bottom: 64px;">
      <div class="size-full">
        @switch (activeTab()) {
          @case ('dashboard') {
            <app-dashboard />
          }
          @case ('lessons') {
            <app-lessons />
          }
          @case ('podcasts') {
            <app-podcasts />
          }
        }
      </div>
    </div>

    <!-- Bottom navigation bar -->
    <nav
      class="fixed bottom-0 flex items-center justify-around bg-white border-t border-[#e1e3e4]"
      style="width: 390px; max-width: 100vw; height: 64px; z-index: 50;"
    >
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          (click)="setTab(tab.id)"
          class="flex flex-col items-center justify-center gap-1 flex-1 h-full"
          style="border: none; background: none; cursor: pointer;"
        >
          @switch (tab.id) {
            @case ('dashboard') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="3" width="8" height="8" rx="2" [attr.fill]="activeTab() === tab.id ? '#000666' : '#767683'" />
                <rect x="13" y="3" width="8" height="8" rx="2" [attr.fill]="activeTab() === tab.id ? '#000666' : '#767683'" [attr.opacity]="activeTab() === tab.id ? '1' : '0.5'" />
                <rect x="3" y="13" width="8" height="8" rx="2" [attr.fill]="activeTab() === tab.id ? '#000666' : '#767683'" [attr.opacity]="activeTab() === tab.id ? '1' : '0.5'" />
                <rect x="13" y="13" width="8" height="8" rx="2" [attr.fill]="activeTab() === tab.id ? '#000666' : '#767683'" />
              </svg>
            }
            @case ('lessons') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M4 6h16M4 10h16M4 14h10M4 18h7" [attr.stroke]="activeTab() === tab.id ? '#000666' : '#767683'" stroke-width="2" stroke-linecap="round" />
              </svg>
            }
            @case ('podcasts') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" [attr.stroke]="activeTab() === tab.id ? '#000666' : '#767683'" stroke-width="2" />
                <path d="M9 8l8 4-8 4V8z" [attr.fill]="activeTab() === tab.id ? '#000666' : '#767683'" />
              </svg>
            }
          }
          <span
            style="font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.5px; line-height: 16px;"
            [style.font-weight]="activeTab() === tab.id ? 500 : 400"
            [style.color]="activeTab() === tab.id ? '#000666' : '#767683'"
          >
            {{ tab.label }}
          </span>
        </button>
      }
    </nav>
  </div>
</div>
